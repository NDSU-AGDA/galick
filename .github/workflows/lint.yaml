name: Lint

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'tools/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.lintr'
      - '.github/workflows/lint.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'tools/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.lintr'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install R
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core

      - uses: r-lib/actions/setup-r@v2
        with:
          install-r: false
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: deps::., any::lintr, any::pkgload, any::testthat
          dependencies: '"hard"'
          cache: always
          install-pandoc: false
          install-quarto: false

      - name: Lint
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          results <- lintr::lint_package()
          print(results)
          if (length(results)) stop("Lint failures detected.")

      - name: Check documentation R syntax and public arguments
        run: Rscript tools/check-documentation.R

name: Lint

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'tools/**/*.R'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.lintr'
      - '.github/workflows/lint.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'tools/**/*.R'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.lintr'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PKG_SYSREQS: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Install R
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 \
            https://cdn.rstudio.com/r/ubuntu-2404/pkgs/r-4.5.3_1_amd64.deb \
            --output "${RUNNER_TEMP}/r-4.5.3.deb"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${RUNNER_TEMP}/r-4.5.3.deb" libxml2
          sudo ln -sf /opt/R/4.5.3/bin/R /usr/local/bin/R
          sudo ln -sf /opt/R/4.5.3/bin/Rscript /usr/local/bin/Rscript
          /opt/R/4.5.3/bin/Rscript --vanilla -e 'stopifnot(getRversion() == "4.5.3")'
          echo '/opt/R/4.5.3/bin' >> "${GITHUB_PATH}"
          sudo R --version

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          install-r: false
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: deps::., any::lintr, any::pkgload, any::testthat
          dependencies: '"hard"'
          cache: 'true'
          install-pandoc: false
          install-quarto: false

      - name: Lint
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          results <- lintr::lint_package()
          print(results)
          if (length(results)) stop("Lint failures detected.")

      - name: Check documentation R syntax and public arguments
        run: Rscript tools/check-documentation.R

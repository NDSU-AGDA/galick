name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: R, lint and docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::lintr
          needs: check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Beagle
        run: |
          curl --fail --location --retry 3 \
            https://faculty.washington.edu/browning/beagle/beagle.29Oct24.c8e.jar \
            --output "${RUNNER_TEMP}/beagle.jar"
          echo "BEAGLE_PATH=${RUNNER_TEMP}/beagle.jar" >> "${GITHUB_ENV}"

      - name: Install VCF interoperability tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix plink1.9
          sudo ln -sf /usr/bin/plink1.9 /usr/local/bin/plink

      - name: Lint source and tests
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          results <- lintr::lint_package()
          print(results)
          if (length(results)) stop("Lint failures detected.")

      - name: Check README and website R examples
        run: Rscript tools/check-documentation.R --run

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Check R package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          error-on: '"note"'
          upload-snapshots: false

      - name: Save documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: galick-docs
          path: site/
          retention-days: 7

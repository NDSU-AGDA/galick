name: R CMD check

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'man/**'
      - '!man/figures/**'
      - 'inst/**'
      - 'vignettes/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'LICENSE*'
      - '.Rbuildignore'
      - '.github/workflows/R-CMD-check.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'man/**'
      - '!man/figures/**'
      - 'inst/**'
      - 'vignettes/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'LICENSE*'
      - '.Rbuildignore'
      - '.github/workflows/R-CMD-check.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Ubuntu R check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      PKG_SYSREQS: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Install R and integration tools
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 \
            https://cdn.rstudio.com/r/ubuntu-2404/pkgs/r-4.5.3_1_amd64.deb \
            --output "${RUNNER_TEMP}/r-4.5.3.deb"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            "${RUNNER_TEMP}/r-4.5.3.deb" bcftools tabix plink1.9 \
            libxml2 libcurl4t64 libssl3t64 libicu74
          if ! command -v java >/dev/null; then
            sudo apt-get install -y --no-install-recommends openjdk-17-jre-headless
          fi
          sudo ln -sf /opt/R/4.5.3/bin/R /usr/local/bin/R
          sudo ln -sf /opt/R/4.5.3/bin/Rscript /usr/local/bin/Rscript
          sudo ln -sf /usr/bin/plink1.9 /usr/local/bin/plink
          /opt/R/4.5.3/bin/Rscript --vanilla -e 'stopifnot(getRversion() == "4.5.3")'
          echo '/opt/R/4.5.3/bin' >> "${GITHUB_PATH}"
          sudo R --version

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          install-r: false
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: 'true'
          install-quarto: false

      - name: Install pinned Beagle
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 \
            https://faculty.washington.edu/browning/beagle/beagle.29Oct24.c8e.jar \
            --output "${RUNNER_TEMP}/beagle.jar"
          echo "BEAGLE_PATH=${RUNNER_TEMP}/beagle.jar" >> "${GITHUB_ENV}"
          java -version

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          error-on: '"note"'
          upload-snapshots: false

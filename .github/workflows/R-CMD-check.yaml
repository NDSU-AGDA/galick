name: R CMD check

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'man/**'
      - '!man/figures/**'
      - 'inst/**'
      - 'vignettes/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'LICENSE*'
      - '.Rbuildignore'
      - '.github/workflows/R-CMD-check.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'man/**'
      - '!man/figures/**'
      - 'inst/**'
      - 'vignettes/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'LICENSE*'
      - '.Rbuildignore'
      - '.github/workflows/R-CMD-check.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Ubuntu R check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install R and integration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core r-base-dev bcftools tabix plink1.9
          sudo ln -sf /usr/bin/plink1.9 /usr/local/bin/plink

      - uses: r-lib/actions/setup-r@v2
        with:
          install-r: false
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: always
          install-quarto: false

      - name: Install pinned Beagle
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 \
            https://faculty.washington.edu/browning/beagle/beagle.29Oct24.c8e.jar \
            --output "${RUNNER_TEMP}/beagle.jar"
          echo "BEAGLE_PATH=${RUNNER_TEMP}/beagle.jar" >> "${GITHUB_ENV}"
          java -version

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          error-on: '"note"'
          upload-snapshots: false

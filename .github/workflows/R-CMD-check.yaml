on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: actions/setup-java@v4
        if: runner.os == 'Linux' && matrix.config.r != 'devel'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Beagle for integration tests
        if: runner.os == 'Linux' && matrix.config.r != 'devel'
        run: |
          curl --fail --location --retry 3 \
            https://faculty.washington.edu/browning/beagle/beagle.29Oct24.c8e.jar \
            --output "${RUNNER_TEMP}/beagle.jar"
          echo "BEAGLE_PATH=${RUNNER_TEMP}/beagle.jar" >> "${GITHUB_ENV}"

      - name: Install VCF interoperability tools
        if: runner.os == 'Linux' && matrix.config.r != 'devel'
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix plink1.9
          sudo ln -sf /usr/bin/plink1.9 /usr/local/bin/plink
          bgzip --version
          tabix --version
          bcftools --version
          plink --version

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

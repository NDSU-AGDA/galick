site_name: Galick
site_description: R tools for VCF validation, Beagle genotype imputation, linked breeding simulation, imputation accuracy evaluation and SNP marker-panel design.
site_url: https://ndsu-agda.github.io/galick/
repo_url: https://github.com/NDSU-AGDA/galick
repo_name: NDSU-AGDA/galick
copyright: >-
  Developed and maintained by
  <a href="https://www.ndsu.edu/agricultural-data-analytics">Agricultural Data Analytics at North Dakota State University</a>.
edit_uri: edit/main/docs/
exclude_docs: |
  /overrides/
  /about/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  font:
    text: Inter
    code: JetBrains Mono

extra:
  version: '0.1.0'
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NDSU-AGDA/galick
  generator: false
  status:
    new: recently added

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

nav:
  - Home: index.md
  - Get started:
    - Installation: getting-started/installation.md
    - Quick tour: getting-started/quick-tour.md
    - The result classes: getting-started/result-classes.md
  - Reference:
    - reference/index.md
    - API signatures: reference/api.md
    - Validate: reference/validate.md
    - Convert (to VCF): reference/convert-to-vcf.md
    - Convert (from VCF): reference/convert-from-vcf.md
    - Repair: reference/repair.md
    - Run Beagle: reference/run-beagle.md
    - Chromosome workflows: reference/chromosome-workflows.md
    - PLINK bridge: reference/plink-bridge.md
    - Reports: reference/reports.md
    - Benchmarking: reference/benchmarking.md
    - Simulation: reference/simulation.md
    - Panel design: reference/panel-design.md
  - Examples:
    - examples/index.md
    - CSV to VCF: examples/csv-to-vcf.md
    - HapMap to VCF: examples/hapmap-to-vcf.md
    - Validate and repair: examples/validate-and-repair.md
    - Run Beagle: examples/run-beagle.md
    - Chromosome-parallel imputation: examples/chromosome-parallel.md
    - Benchmark accuracy: examples/benchmark-accuracy.md
    - Export and merge VCFs: examples/export-and-merge.md
    - Linked simulation: examples/simulate-vcf.md
    - Held-out evaluation: examples/evaluate-imputation.md
    - Marker panel design: examples/design-marker-panel.md
  - Changelog: changelog.md
